{% extends "dashboard/base_dashboard.html" %}

{% block title %}Delete Event{% endblock %}

{% block content %}

<div class="container-fluid">

<div class="card shadow">

<div class="card-body">

<h4>

Delete Event

</h4>

<p>

Are you sure you want to delete

<strong>

{{ event.title }}

</strong>?

</p>

<form method="post">

{% csrf_token %}

<button class="btn btn-danger">

Delete

</button>

<a
href="{% url 'event_list' %}"
class="btn btn-secondary">

Cancel

</a>

</form>

</div>

</div>

</div>

{% endblock %}
