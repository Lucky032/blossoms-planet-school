<section class="bg-primary text-white py-5">

    <div class="container">

        <div class="row text-center">

            {% for stat in statistics %}

            <div class="col-6 col-lg-3 mb-4">

                <div class="display-4">

                    {{ stat.icon }}

                </div>

                <h1 class="fw-bold">

                    {{ stat.value }}{{ stat.suffix }}

                </h1>

                <p>

                    {{ stat.title }}

                </p>

            </div>

            {% empty %}

            <div class="col-12">

                <h5>

                    Statistics will be updated soon.

                </h5>

            </div>

            {% endfor %}

        </div>

    </div>

</section>
