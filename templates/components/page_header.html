<div class="d-flex justify-content-between align-items-center mb-4">

    <div>

        <h3 class="fw-bold mb-1">

            <i class="bi {{ page_icon }}"></i>

            {{ page_title }}

        </h3>

        <p class="text-muted mb-0">

            {{ page_subtitle }}

        </p>

    </div>

    {% if button_url %}

    <a href="{{ button_url }}" class="btn btn-primary">

        <i class="bi bi-plus-circle"></i>

        {{ button_text }}

    </a>

    {% endif %}

</div>
