{% extends "accounts/base_auth.html" %}

{% block title %}
Forgot Password
{% endblock %}

{% block content %}

<div class="text-center mb-4">

    <h2 class="fw-bold">
        Forgot Password?
    </h2>

    <p class="text-muted">
        Enter your registered email address.
    </p>

</div>

<form method="post">

    {% csrf_token %}

    <div class="mb-4">

        <label class="form-label">
            Email Address
        </label>

        {{ form.email }}

    </div>

    <div class="d-grid">

        <button
            class="btn btn-primary btn-auth"
            type="submit">

            Send OTP

        </button>

    </div>

</form>

<hr>

<div class="text-center">

    <a href="{% url 'login' %}">
        ← Back to Login
    </a>

</div>

{% endblock %}
