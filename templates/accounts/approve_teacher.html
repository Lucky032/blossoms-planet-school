{% extends "dashboard/base_dashboard.html" %}

{% block title %}Approve Teacher{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h4>Approve Teacher</h4>
        </div>

        <div class="card-body">

            <h5>{{ teacher.user.first_name }} {{ teacher.user.last_name }}</h5>

            <p>
                <strong>Email:</strong> {{ teacher.user.email }}<br>
                <strong>Phone:</strong> {{ teacher.phone }}
            </p>

            <form method="POST">

                {% csrf_token %}

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label>Gender</label>

                        <select
                            name="gender"
                            class="form-control"
                            required>

                            <option value="">Select Gender</option>
                            <option>Male</option>
                            <option>Female</option>
                            <option>Other</option>

                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Qualification</label>

                        <input
                            type="text"
                            name="qualification"
                            class="form-control"
                            required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Experience (Years)</label>

                        <input
                            type="number"
                            name="experience"
                            class="form-control"
                            value="0"
                            min="0"
                            required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Salary</label>

                        <input
                            type="number"
                            name="salary"
                            class="form-control"
                            value="0"
                            required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Joining Date</label>

                        <input
                            type="date"
                            name="joining_date"
                            class="form-control"
                            required>
                    </div>

                    <div class="col-md-12 mb-3">
                        <label>Address</label>

                        <textarea
                            name="address"
                            class="form-control"
                            rows="3"></textarea>
                    </div>

                </div>

                <button
                    class="btn btn-success">

                    Approve Teacher

                </button>

                <a
                    href="{% url 'pending_teachers' %}"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
