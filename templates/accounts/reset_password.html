{% extends "accounts/base_auth.html" %}

{% block title %}
Reset Password
{% endblock %}

{% block content %}

<div class="text-center mb-4">

    <h2 class="fw-bold">
        Reset Password
    </h2>

    <p class="text-muted">
        Create your new password.
    </p>

</div>

<form method="post">

    {% csrf_token %}

    <div class="mb-3">

        <label class="form-label">
            New Password
        </label>

        {{ form.password1 }}

    </div>

    <div class="mb-4">

        <label class="form-label">
            Confirm Password
        </label>

        {{ form.password2 }}

    </div>

    <div class="d-grid">

        <button
            class="btn btn-primary btn-auth"
            type="submit">

            Reset Password

        </button>

    </div>

</form>

<div class="text-center mt-4">

    <a href="{% url 'login' %}">
        Back to Login
    </a>

</div>

{% endblock %}x
